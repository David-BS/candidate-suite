name: CI

# Quality gate. On every pull request to main (and on pushes to main), the code
# must pass lint, format check, a compile sweep, and the test slot. With branch
# protection requiring this check, nothing merges into main unless it is green.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install ruff==0.15.16 pytest

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Compile all scripts
        run: python -m compileall -q scripts modules

      - name: Tests (pytest — TST-1 slot)
        run: |
          pytest tests/ || ec=$?
          if [ "${ec:-0}" -eq 5 ]; then
            echo "No tests collected yet (TST-1 pending)."
            exit 0
          fi
          exit "${ec:-0}"
