name: CI

# Quality gate. On every pull request to main (and on pushes to main), the code
# must pass lint, format check, and a compile sweep. With branch
# protection requiring this check, nothing merges into main unless it is green.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install ruff==0.15.16

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Compile all scripts
        run: python -m compileall -q scripts modules
