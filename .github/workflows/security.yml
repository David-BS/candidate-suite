name: Security

# Security gate (SAST). On every pull request to main (and on pushes to main),
# the Python code must pass a Bandit scan. With branch protection requiring this
# check, nothing merges into main unless it is green. Mirrors the quality gate:
# the tool is pip-installed and pinned (no marketplace action -> no Node runtime
# debt), and the scan covers the WHOLE repo (tooling/ included), as ruff does.
#
# Configuration lives in pyproject.toml under [tool.bandit] (single source of
# truth, like the ruff config). Deliberate, documented skips there; the
# dangerous shell case (B602) stays active.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install "bandit[toml]==1.9.4"

      - name: Bandit (SAST)
        run: bandit -c pyproject.toml -r .
