name: CodeQL

# Semantic security analysis (advanced setup, committed and reviewable).
# Runs on every pull request to main, on pushes to main, and weekly on a
# schedule (so newly published CodeQL queries are applied even when the code
# has not changed). The `security-extended` query suite is broader than the
# default suite — chosen deliberately for maximum security detection.
#
# Action pin: github/codeql-action@v4 (floating major), bumped from v3 by
# Dependabot. v4 runs on the Node 24 runtime, so it no longer carries the
# Node 20 deprecation annotation. The floating major follows future bumps
# automatically; Dependabot opens the PR when a new major ships.
#
# Do NOT also enable CodeQL "default setup" in repo settings — default and
# advanced setup are mutually exclusive; this committed workflow IS the advanced
# setup.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # Python is interpreted — no build step needed.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
