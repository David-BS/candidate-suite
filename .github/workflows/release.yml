name: Release skill

# Builds the .skill package and attaches it to a GitHub Release whenever a
# version tag (e.g. v0.16.2) is pushed. Non-technical users then download a
# ready-to-use .skill from the Releases page — no clone, no build.
#
# Hard test gate (TST-1): the build runs ONLY if the graded suite passes first.
# On a release tag the suite runs at L1 (wkhtmltopdf → Markdown→PDF exercised);
# on a major tag vN.0.0 it also runs at L2 (LibreOffice → DOCX→PDF exercised).
# A failing suite blocks the release entirely.
#
# It also builds an "acceptance gallery" (one example of every deliverable, from
# fictional data) and attaches it to the Release as a .zip, so each version ships
# a set of pieces to verify on sight that nothing visible broke.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required to create the Release and upload the asset

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Guard - tag must match SKILL.md version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^version:[[:space:]]*//p' SKILL.md | head -1)"
          echo "tag=$tag  SKILL.md=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Release tag v$tag does not match SKILL.md version $ver. Align SKILL.md or the tag before releasing." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # L0 base: the runtime packages the Claude environment provides.
      - name: Install test dependencies
        run: pip install pytest python-docx markdown

      # L1 (every release tag): the Markdown→PDF converter.
      - name: Install wkhtmltopdf (L1)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wkhtmltopdf

      # L2 (major tag vN.0.0): LibreOffice for the DOCX→PDF conversion.
      - name: Install LibreOffice (major tag → L2)
        if: endsWith(github.ref_name, '.0.0')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice

      - name: Run tests
        run: pytest tests/ --junitxml=report.xml

      - name: Write test summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          out = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = ["## Test results", ""]
          if not os.path.exists("report.xml"):
              lines.append("No report produced.")
          else:
              root = ET.parse("report.xml").getroot()
              suites = root.findall("testsuite") or [root]
              total = failures = errors = skipped = 0
              failed = []
              for s in suites:
                  total += int(s.get("tests", 0))
                  failures += int(s.get("failures", 0))
                  errors += int(s.get("errors", 0))
                  skipped += int(s.get("skipped", 0))
                  for tc in s.findall("testcase"):
                      if tc.find("failure") is not None or tc.find("error") is not None:
                          failed.append(f"{tc.get('classname', '')}::{tc.get('name', '')}")
              passed = total - failures - errors - skipped
              lines += [
                  "| Passed | Failed | Errors | Skipped | Total |",
                  "|---|---|---|---|---|",
                  f"| {passed} | {failures} | {errors} | {skipped} | {total} |",
                  "",
              ]
              lines.append("All tests passed." if not failed else "### Failures")
              lines += [f"- `{n}`" for n in failed]
          with open(out, "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

  build-and-release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # TODO (DEP-3 / CI-CD): resync the interface-language list before building
      # (11 official Claude UI languages + "Other… (ISO code)"). Single source of
      # truth lives in the skill; this step keeps it aligned with Anthropic's list.
      # See roadmap DEP-3.

      - name: Build .skill package
        run: python tooling/build_skill.py --output-dir dist

      # Acceptance gallery: one example of every deliverable, from fictional
      # data, attached to the Release for on-sight review. Needs the PDF
      # converters, so install them here (this job runs only on a tag).
      - name: Install gallery dependencies
        run: |
          pip install python-docx markdown
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wkhtmltopdf libreoffice

      - name: Build acceptance gallery
        run: python tooling/build_samples.py --output-dir dist/samples --zip "dist/candidate-suite-samples-${GITHUB_REF_NAME}.zip"

      - name: Create Release and attach the .skill + gallery
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.skill
            dist/candidate-suite-samples-*.zip
          generate_release_notes: true
