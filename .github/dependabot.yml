# Dependabot — keeps the GitHub Actions used by the release workflow up to date.
# When an action publishes a new version (e.g. one that moves off the deprecated
# Node 20 runtime to Node 24), Dependabot opens a pull request bumping its pinned
# tag in .github/workflows/. You just review and merge — no manual watching of
# each action's Releases page.
#
# Scope: only the github-actions ecosystem. The skill's Python dependencies
# (python-docx, markdown) are provided by the runtime environment and are not
# declared in a requirements.txt / pyproject, so there is no Python manifest for
# a pip ecosystem to track.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"           # scans .github/workflows/
    schedule:
      interval: "monthly"    # low-noise; security/major bumps still surface
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
